<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-accent="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Music — YouTube Music Premium Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #030303;
      --bg-sidebar: #0f0f0f;
      --bg-card: #1f1f1f;
      --bg-hover: #2f2f2f;
      --bg-input: #212121;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --shadow: 0 16px 32px rgba(0, 0, 0, 0.8);
      --accent: #dc143c;
      --accent-hover: #ff2e55;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text);
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }

    /* 레이아웃 구조 */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      z-index: 10;
    }

    .brand {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .menu-item:hover, .menu-item.active {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .menu-item.active {
      border-left: 4px solid var(--accent);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px;
      padding-bottom: 120px; /* 플레이어 하단 마진 */
      overflow-y: auto;
    }

    /* 검색창 컴포넌트 */
    .search-container {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      max-width: 600px;
    }

    .search-input {
      flex: 1;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px 24px;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .btn {
      background-color: var(--accent);
      color: var(--text);
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    /* 콘텐츠 뷰 패널 제어 */
    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .section-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* 오디오 트랙 리스트 UI */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.02);
      transition: background 0.2s;
      cursor: pointer;
    }

    .track-row:hover {
      background-color: var(--bg-hover);
    }

    .track-rank {
      width: 40px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .track-art-img {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: 16px;
    }

    .track-meta {
      flex: 1;
    }

    .track-title-text {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .track-artist-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 실시간 가사 전용 뷰 박스 */
    .lyrics-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 700px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 2.2;
      font-size: 16px;
      text-align: center;
    }

    /* 하단 고정 오디오 제어 데크 */
    .player-deck {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 90px;
      background-color: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
    }

    .deck-left {
      display: flex;
      align-items: center;
      width: 30%;
    }

    .deck-art {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background-color: var(--bg-card);
      object-fit: cover;
      margin-right: 16px;
    }

    .deck-details {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .deck-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .deck-artist {
      font-size: 13px;
      color: var(--text-muted);
    }

    .deck-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 40%;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .ctrl-btn:hover {
      color: var(--accent);
    }

    .ctrl-btn-play {
      background-color: var(--text);
      color: var(--bg-app);
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }

    .ctrl-btn-play:hover {
      background-color: var(--accent);
      color: var(--text);
    }

    .progress-area {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      transition: transform 0.1s;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .deck-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 30%;
      gap: 12px;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 120px;
    }

    /* 백그라운드 구동을 위한 완전 은닉 하드웨어 엔진 */
    #youtube-iframe-hardware-engine {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Aura Music
    </div>
    <ul class="menu">
      <li class="menu-item active" onclick="switchView('chart-view')">멜론 TOP 100</li>
      <li class="menu-item" onclick="switchView('search-view')">음악 검색</li>
      <li class="menu-item" onclick="switchView('lyrics-view')">실시간 가사</li>
    </ul>
  </div>

  <div class="main-content">
    
    <div id="chart-view" class="view-panel active">
      <div class="section-title">Melon 실시간 TOP 100</div>
      <div id="chart-list" class="track-list">
        <p style="color: var(--text-muted)">차트 데이터를 불러오는 중입니다...</p>
      </div>
    </div>

    <div id="search-view" class="view-panel">
      <div class="section-title">노래 검색</div>
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="곡명 또는 아티스트를 입력하세요..." onkeydown="if(event.key==='Enter') executeSearch()">
        <button class="btn" onclick="executeSearch()">검색</button>
      </div>
      <div id="search-results" class="track-list">
        <p style="color: var(--text-muted)">검색 결과를 입력해 주세요.</p>
      </div>
    </div>

    <div id="lyrics-view" class="view-panel">
      <div class="section-title" id="lyrics-track-title">재생 중인 곡 없음</div>
      <div id="lyrics-text" class="lyrics-box">음악이 재생되면 이곳에 실시간 가사가 표출됩니다.</div>
    </div>

  </div>

  <div class="player-deck">
    <div class="deck-left">
      <img id="track-art" class="deck-art" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Art">
      <div class="deck-details">
        <div id="track-title" class="deck-title">재생 중인 곡 없음</div>
        <div id="track-artist" class="deck-artist">Aura Player</div>
      </div>
    </div>

    <div class="deck-center">
      <div class="control-buttons">
        <button class="ctrl-btn" onclick="skipPrevTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-btn-play" onclick="togglePlay()">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="skipNextTrack()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg>
        </button>
      </div>
      <div class="progress-area">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" class="slider" min="0" max="100" value="0" oninput="userSeeking(this.value)" onchange="userSeekEnd(this.value)">
        <span id="total-time">0:00</span>
      </div>
    </div>

    <div class="deck-right">
      <div class="volume-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="volume-slider" class="slider" min="0" max="100" value="50" oninput="adjustVolume(this.value)">
      </div>
    </div>
  </div>

  <div id="youtube-iframe-hardware-engine"></div>

  <script>
    // 1. 애플리케이션 데이터 런타임 상태 관리 컨텍스트
    const STATE = {
      playerEngine: null,
      isEngineReady: false,
      queue: [],
      currentIndex: -1,
      isUserSeeking: false,
      positionTimer: null
    };

    // 2. 고속 렌더링용 DOM 요소 레퍼런스 인덱싱
    const dom = {
      deckPlayIcon: document.getElementById('play-icon'),
      deckVolume: document.getElementById('volume-slider'),
      progressBar: document.getElementById('progress-bar'),
      currentTimeLabel: document.getElementById('current-time'),
      totalTimeLabel: document.getElementById('total-time'),
      trackTitle: document.getElementById('track-title'),
      trackArtist: document.getElementById('track-artist'),
      trackArt: document.getElementById('track-art'),
      chartList: document.getElementById('chart-list'),
      searchResults: document.getElementById('search-results'),
      searchInput: document.getElementById('search-input'),
      lyricsText: document.getElementById('lyrics-text'),
      lyricsTrackTitle: document.getElementById('lyrics-track-title')
    };

    // 3. 내비게이션 뷰 레이어 스위칭 로직
    function switchView(viewId) {
      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      const menuIdx = viewId === 'chart-view' ? 0 : viewId === 'search-view' ? 1 : 2;
      document.querySelectorAll('.menu-item')[menuIdx].classList.add('active');
    }

    // 4. 백엔드 연동: /api/top100 데이터 로딩 및 인앱 차트 생성
    async function loadTop100Chart() {
      try {
        const response = await fetch('/api/top100');
        const data = await response.json();
        if (data.success && data.tracks) {
          STATE.queue = data.tracks;
          dom.chartList.innerHTML = '';
          data.tracks.forEach((track, index) => {
            const row = document.createElement('div');
            row.className = 'track-row';
            row.onclick = () => playTrackFromQueue(index);
            row.innerHTML = `
              <div class="track-rank">${track.rank}</div>
              <img class="track-art-img" src="${track.albumArt}" alt="art">
              <div class="track-meta">
                <div class="track-title-text">${track.title}</div>
                <div class="track-artist-text">${track.artist}</div>
              </div>
            `;
            dom.chartList.appendChild(row);
          });
        } else {
          dom.chartList.innerHTML = `<p style="color:var(--accent)">차트 데이터를 가져오는데 실패했습니다.</p>`;
        }
      } catch (err) {
        console.error("차트 로딩 실패:", err);
        dom.chartList.innerHTML = `<p style="color:var(--accent)">네트워크 수신에 오류가 발생했습니다.</p>`;
      }
    }

    // 5. 백엔드 연동: /api/search를 경유하여 곡 검색 및 재생 처리
    async function executeSearch() {
      const query = dom.searchInput.value.trim();
      if (!query) return;
      dom.searchResults.innerHTML = '<p style="color: var(--text-muted)">유튜브 엔진에서 일치 항목 매칭 중...</p>';
      switchView('search-view');

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (data.success && data.videoId) {
          const tempTrack = {
            title: query,
            artist: '검색 인덱스 트랙',
            albumArt: 'https://via.placeholder.com/512x512.png?text=Search+Result',
            id: data.videoId,
            directId: data.videoId
          };
          STATE.queue = [tempTrack];
          playTrackFromQueue(0);
          
          dom.searchResults.innerHTML = `
            <div class="track-row" onclick="playTrackFromQueue(0)">
              <div class="track-rank">🔍</div>
              <img class="track-art-img" src="${tempTrack.albumArt}" alt="art">
              <div class="track-meta">
                <div class="track-title-text">${tempTrack.title}</div>
                <div class="track-artist-text">클릭 시 스트리밍 하드웨어 다이렉트 재생</div>
              </div>
            </div>
          `;
        } else {
          dom.searchResults.innerHTML = '<p style="color:var(--accent)">일치하는 오디오 비디오 스트림이 존재하지 않습니다.</p>';
        }
      } catch (err) {
        console.error("검색 실패:", err);
        dom.searchResults.innerHTML = '<p style="color:var(--accent)">검색 처리 엔진에 에러가 감지되었습니다.</p>';
      }
    }

    // 6. 백엔드 연동: /api/lyrics 가사 데이터 파싱 및 결합
    async function loadLyrics(title, artist) {
      dom.lyricsTrackTitle.innerText = `${title} - ${artist}`;
      dom.lyricsText.innerText = "서버 가사 데이터베이스에서 조회 중입니다...";
      try {
        const response = await fetch(`/api/lyrics?title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}`);
        const data = await response.json();
        if (data.success && data.lyrics) {
          dom.lyricsText.innerText = data.lyrics;
        } else {
          dom.lyricsText.innerText = "매칭되는 정식 LRC 및 텍스트 가사가 등록되어 있지 않습니다.";
        }
      } catch (err) {
        dom.lyricsText.innerText = "가사 백엔드 네트워크 연동 처리에 오류가 있습니다.";
      }
    }

    // 7. 핵심 코어 오디오 재생 파이프라인
    async function playTrackFromQueue(index) {
      if (index < 0 || index >= STATE.queue.length) return;
      STATE.currentIndex = index;
      const track = STATE.queue[index];

      // 클라이언트 플레이어 플레이 데크 UI 갱신
      dom.trackTitle.innerText = track.title;
      dom.trackArtist.innerText = track.artist;
      dom.trackArt.src = track.albumArt;

      // 가사 파싱 백그라운드 호출 및 Media Session 메타데이터 연동
      loadLyrics(track.title, track.artist);
      updateMediaSessionMetadata(track.title, track.artist, track.albumArt);

      if (!STATE.isEngineReady) return;

      if (track.directId) {
        STATE.playerEngine.loadVideoById(track.directId);
      } else {
        try {
          const searchQuery = `${track.artist} ${track.title}`;
          const response = await fetch(`/api/search?q=${encodeURIComponent(searchQuery)}`);
          const searchData = await response.json();
          if (searchData.success && searchData.videoId) {
            STATE.playerEngine.loadVideoById(searchData.videoId);
          } else {
            console.error("유튜브 재생 링크 조회 실패");
            skipNextTrack();
          }
        } catch (e) {
          console.error("재생 처리 파이프라인 에러:", e);
        }
      }
    }

    // 8. 오디오 플레이 재생/일시정지 토글링 제어
    function togglePlay() {
      if (!STATE.isEngineReady || !STATE.playerEngine) return;
      const state = STATE.playerEngine.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        STATE.playerEngine.pauseVideo();
      } else {
        STATE.playerEngine.playVideo();
      }
    }

    // 9. 순환 큐 기반 트랙 네비게이션 제어
    function skipNextTrack() {
      if (STATE.queue.length === 0) return;
      let nextIdx = STATE.currentIndex + 1;
      if (nextIdx >= STATE.queue.length) nextIdx = 0;
      playTrackFromQueue(nextIdx);
    }
    // 유튜브 엔진 이벤트용 전역 매핑 확보
    window.skipNextTrack = skipNextTrack;

    function skipPrevTrack() {
      if (STATE.queue.length === 0) return;
      let prevIdx = STATE.currentIndex - 1;
      if (prevIdx < 0) prevIdx = STATE.queue.length - 1;
      playTrackFromQueue(prevIdx);
    }

    // 10. 볼륨 인덱스 설정 조절
    function adjustVolume(value) {
      if (STATE.isEngineReady && STATE.playerEngine) {
        STATE.playerEngine.setVolume(value);
      }
    }

    // 11. 브라우저 내부 타임라인 바 드래그 탐지 및 조절
    function userSeeking(value) {
      STATE.isUserSeeking = true;
      if (STATE.playerEngine && typeof STATE.playerEngine.getDuration === 'function') {
        const duration = STATE.playerEngine.getDuration();
        const targetSeconds = (value / 100) * duration;
        dom.currentTimeLabel.innerText = formatTime(targetSeconds);
      }
    }

    function userSeekEnd(value) {
      if (STATE.playerEngine && typeof STATE.playerEngine.getDuration === 'function') {
        const duration = STATE.playerEngine.getDuration();
        const targetSeconds = (value / 100) * duration;
        STATE.playerEngine.seekTo(targetSeconds, true);
      }
      STATE.isUserSeeking = false;
      updatePositionState();
    }

    // 보조 라이브러리: 재생 초 단위를 가시적 (분:초) 포맷으로 가공
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === undefined) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // =======================================================
    // 👑 [👑 PREMIUM UPGRADE 👑] MEDIA SESSION 백그라운드 엔진 고도화 구현
    // =======================================================
    
    // OS 미디어 컨트롤러 메타데이터 인젝션 (잠금 화면 및 창 최소화 헤더 셋업)
    function updateMediaSessionMetadata(title, artist, albumArt) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title || '알 수 없는 곡명',
          artist: artist || '아티스트 미상',
          album: 'Aura Premium Player',
          artwork: [
            { 
              src: albumArt || 'https://via.placeholder.com/512x512.png?text=Aura+Music', 
              sizes: '512x512', 
              type: 'image/png' 
            }
          ]
        });
      }
    }

    // 핵심: OS 미디어 제어 제어판 내부의 타임라인(재생 바 위치) 정밀 하드웨어 싱크
    function updatePositionState() {
      if ('mediaSession' in navigator && STATE.playerEngine && typeof STATE.playerEngine.getDuration === 'function') {
        try {
          const duration = STATE.playerEngine.getDuration();
          const currentTime = STATE.playerEngine.getCurrentTime();
          const playbackRate = STATE.playerEngine.getPlaybackRate();

          if (duration > 0 && !STATE.isUserSeeking) {
            // OS 백그라운드 팝업창 내 타임라인 시간 정보 제공
            navigator.mediaSession.setPositionState({
              duration: duration,
              playbackRate: playbackRate,
              position: currentTime
            });

            // 동시에 브라우저 내부 타임라인 바 및 텍스트 레이블 역방향 동기화 구현
            const progressPercent = (currentTime / duration) * 100;
            dom.progressBar.value = progressPercent;
            dom.currentTimeLabel.innerText = formatTime(currentTime);
            dom.totalTimeLabel.innerText = formatTime(duration);
          }
        } catch (error) {
          console.warn("오디오 하드웨어 타임라인 동기화 대기 중:", error);
        }
      }
    }

    // 핵심: 최소화 제어 컨트롤 창에서 오는 하드웨어 이벤트 신호를 모조리 후킹(Hooking)하여 결합
    function setupMediaSessionHandlers() {
      if ('mediaSession' in navigator) {
        // OS 팝업창 '재생'
        navigator.mediaSession.setActionHandler('play', () => {
          if (STATE.playerEngine) STATE.playerEngine.playVideo();
        });
        
        // OS 팝업창 '일시정지'
        navigator.mediaSession.setActionHandler('pause', () => {
          if (STATE.playerEngine) STATE.playerEngine.pauseVideo();
        });
        
        // OS 팝업창 '이전 곡 이동'
        navigator.mediaSession.setActionHandler('previoustrack', () => {
          skipPrevTrack();
        });
        
        // OS 팝업창 '다음 곡 이동'
        navigator.mediaSession.setActionHandler('nexttrack', () => {
          skipNextTrack();
        });
        
        // ⭐ 최상위 난이도: OS 팝업 미디어 재생 바를 유저가 직접 슬라이드 제어(드래그)했을 때 연동
        navigator.mediaSession.setActionHandler('seekto', (details) => {
          if (STATE.playerEngine && typeof STATE.playerEngine.seekTo === 'function') {
            // 하드웨어 제어판의 타깃 시간(seekTime)을 수집하여 유튜브 엔진 코어 타임라인 강제 변경
            STATE.playerEngine.seekTo(details.seekTime, true);
            updatePositionState(); // 변경 직후 즉각 갱신
          }
        });
      }
    }

    // 12. 유튜브 IFrame API 로드 완료 시 구동 명세 연동
    window.onYouTubeIframeAPIReady = function() {
      STATE.playerEngine = new YT.Player("youtube-iframe-hardware-engine", {
        height: "0", 
        width: "0",
        playerVars: {
          autoplay: 0, 
          controls: 0, 
          disablekb: 1, 
          fs: 0, 
          rel: 0, 
          playsinline: 1, // 모바일 iOS/Android 전역 환경 백그라운드 재생 오토락 우회
          iv_load_policy: 3
        },
        events: {
          onReady: () => {
            STATE.isEngineReady = true;
            STATE.playerEngine.setVolume(dom.deckVolume.value || 50);
            
            // 시스템 미디어 세션 통신용 핸들러 링킹
            setupMediaSessionHandlers();
            
            // 첫 진입 시 멜론 실시간 차트 인덱스 로딩
            loadTop100Chart();
          },
          onStateChange: (e) => {
            // 플레이어 재생 엔진 구동 상태 감지
            if (e.data === YT.PlayerState.PLAYING) {
              dom.deckPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
              
              if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "playing";
                updatePositionState();
              }
              
              // 브라우저 백그라운드 전환 상태에서도 1초 주기로 타임라인 슬라이더를 전사(Mapping)하는 정밀 타이머 가동
              if (!STATE.positionTimer) {
                STATE.positionTimer = setInterval(updatePositionState, 1000);
              }
            } 
            // 플레이어 일시정지 및 버퍼링 상태 감지
            else {
              dom.deckPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
              
              if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "paused";
              }
              
              // 불필요한 백그라운드 클럭 리소스 소모 방지를 위해 타이머 소멸
              clearInterval(STATE.positionTimer);
              STATE.positionTimer = null;
            }

            // 하나의 영상 스트림이 완료(ENDED)되었을 때 큐 연쇄 셔틀링 구동
            if (e.data === YT.PlayerState.ENDED) { 
              skipNextTrack(); 
            }
          }
        }
      });
    };

    // YouTube IFrame API 하드웨어 드라이버 로더 인젝션
    const scriptNode = document.createElement("script");
    scriptNode.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(scriptNode, firstScriptTag);
  </script>
