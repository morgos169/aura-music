<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-accent="crimson">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Music — YouTube Music Premium Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-app: #030303;
      --bg-sidebar: #0f0f0f;
      --bg-card: #1f1f1f;
      --bg-hover: #2f2f2f;
      --bg-input: #212121;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #aaaaaa;
      --shadow: 0 16px 32px rgba(0, 0, 0, 0.8);
      --accent: #ff0033;
      --accent-rgb: 255, 0, 51;
      --accent-gradient: linear-gradient(135deg, #ff0033, #ff4500);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background-color: var(--bg-app);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: calc(100vh - 90px);
      width: 100%;
    }

    /* Sidebar Design */
    .sidebar {
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-left: 0.5rem;
    }

    .brand-logo-ym {
      width: 30px;
      height: 30px;
      background: var(--accent-gradient);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(var(--accent-rgb), 0.6);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .nav-item.active {
      font-weight: 700;
    }

    /* Main Content Area */
    .main-viewport {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .top-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background-color: rgba(3, 3, 3, 0.9);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    .search-input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 6px;
      border: 1px solid transparent;
      background-color: var(--bg-input);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus {
      background-color: var(--bg-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .search-icon-svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .view-content-pane {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 4rem 2rem;
    }

    .view-pane {
      display: none;
    }

    .view-pane.active {
      display: block;
    }

    /* Mood Filter Chips */
    .mood-chips-container {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .mood-chip {
      padding: 0.5rem 1rem;
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .mood-chip:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .mood-chip.active {
      background-color: var(--text);
      color: var(--bg-app);
      font-weight: 600;
    }

    /* Shelves */
    .shelf-section {
      margin-bottom: 2.5rem;
    }

    .shelf-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 1rem;
    }

    .shelf-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .quick-picks-grid {
      display: grid;
      grid-template-rows: repeat(4, auto);
      grid-auto-flow: column;
      grid-auto-columns: minmax(340px, 1fr);
      gap: 0.75rem 1.5rem;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    .quick-pick-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }

    .quick-pick-item:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .qp-thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #000;
    }

    .qp-meta {
      flex: 1;
      min-width: 0;
      padding-right: 2.5rem;
    }

    .qp-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .qp-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inline-add-btn {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 5;
    }

    .inline-add-btn:hover {
      background: var(--accent);
      transform: translateY(-50%) scale(1.1);
    }

    /* 대기열 재정렬 버튼 스타일 */
    .queue-reorder-controls {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 6;
    }

    .queue-move-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #ccc;
      width: 24px;
      height: 20px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .queue-move-btn:hover {
      background: rgba(255,255,255,0.3);
      color: #fff;
    }

    .yt-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.25rem;
    }

    .music-square-card {
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .card-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 0.6rem;
      background-color: #111;
    }

    .card-thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .music-square-card:hover .card-play-overlay {
      opacity: 1;
    }

    .overlay-play-icon {
      width: 40px;
      height: 40px;
      background-color: rgba(0,0,0,0.7);
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-add-overlay-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      z-index: 6;
    }

    .music-square-card:hover .card-add-overlay-btn {
      opacity: 1;
    }

    .card-add-overlay-btn:hover {
      background: var(--accent);
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list-table {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .table-row {
      display: flex;
      align-items: center;
      padding: 0.6rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      gap: 1rem;
      position: relative;
    }

    .table-row:hover {
      background-color: rgba(255,255,255,0.05);
    }

    .table-row.active-playing {
      background-color: rgba(255, 0, 51, 0.1);
    }

    .table-row.active-playing .row-song-title {
      color: var(--accent);
    }

    .playlist-folder-item {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .playlist-folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.5rem;
    }

    /* Player Deck */
    .persistent-player-deck {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 90px;
      background-color: #1a1a1a;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      align-items: center;
      padding: 0 1.5rem;
      z-index: 1000;
    }

    .metadata-deck-display {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    .deck-thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
    }

    .deck-control-actions {
      display: flex;
      gap: 0.2rem;
    }

    .icon-action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: 50%;
      font-size: 1.1rem;
    }

    .icon-action-btn:hover, .icon-action-btn.active {
      color: var(--text);
      background-color: rgba(255,255,255,0.1);
    }

    .icon-action-btn.active {
      color: var(--accent);
    }

    .center-stream-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }

    .playback-buttons-cluster {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .master-play-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--text);
      color: var(--bg-app);
      border: none;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .master-play-circle svg {
      width: 18px;
      height: 18px;
    }

    .progress-slider-bar-track {
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .timestamp-ticker {
      font-size: 0.75rem;
      color: var(--text-muted);
      min-width: 35px;
    }

    .progress-interactive-rail {
      flex: 1;
      height: 3px;
      background-color: rgba(255,255,255,0.15);
      position: relative;
      cursor: pointer;
    }

    .progress-interactive-rail:hover {
      height: 5px;
    }

    .progress-rail-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
    }

    .utility-audio-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* Modals & Drawers */
    .playlist-modal-popup {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 5000;
      display: none;
      place-items: center;
    }

    .playlist-modal-popup.active-modal {
      display: grid;
    }

    .modal-card {
      background: #1f1f1f;
      border: 1px solid var(--border);
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .modal-playlist-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 1.25rem;
    }

    .modal-playlist-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid transparent;
      color: #fff;
      padding: 0.75rem 1rem;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .modal-playlist-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.1);
    }

    .modal-close-btn {
      background: transparent;
      border: 1px solid #444;
      color: var(--text-muted);
      width: 100%;
      padding: 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    
    .modal-close-btn:hover {
      color: #fff;
      border-color: #666;
    }

    .queue-panel-drawer {
      position: fixed;
      right: -360px;
      bottom: 90px;
      top: 0;
      width: 360px;
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border);
      z-index: 900;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .queue-panel-drawer.open {
      right: 0;
    }

    .queue-track-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .alert-toast-popup {
      position: fixed;
      bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: #212121;
      color: #fff;
      padding: 0.6rem 1.5rem;
      border-radius: 4px;
      font-size: 0.88rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 10000;
    }

    .alert-toast-popup.active-trigger {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .load-more-btn {
      display: none;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .load-more-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.3);
    }

    @media (max-width: 768px) {
      body { overflow: hidden; }
      
      .app-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        height: calc(100vh - 145px);
      }

      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 1rem;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        background-color: var(--bg-sidebar);
        z-index: 100;
      }

      .brand-section { display: none; }

      .nav-menu {
        flex-direction: row;
        width: 100%;
        justify-content: space-around;
        gap: 0.25rem;
      }

      .nav-item {
        padding: 0.6rem;
        font-size: 0.85rem;
        flex: 1;
        text-align: center;
        justify-content: center;
        gap: 0.4rem;
        border-radius: 6px;
      }

      .top-header-bar { padding: 0.5rem 1rem; }
      .search-wrapper { max-width: 100%; }
      .view-content-pane { padding: 1rem 1rem 3rem 1rem; }

      .quick-picks-grid {
        grid-auto-columns: minmax(280px, 1fr);
        gap: 0.5rem 1rem;
      }

      .yt-cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      #pane-library > div {
        grid-template-columns: 1fr !important;
        gap: 2rem !important;
      }

      .persistent-player-deck {
        display: flex;
        flex-direction: column;
        height: 145px;
        padding: 0.6rem 1rem;
        gap: 0.5rem;
        justify-content: center;
        background-color: #121212;
      }

      .metadata-deck-display { width: 100%; justify-content: space-between; }
      .metadata-deck-display .qp-meta { padding-right: 1rem; }
      .center-stream-controls { width: 100%; gap: 0.4rem; }
      .playback-buttons-cluster { gap: 1.2rem; }
      .master-play-circle { width: 34px; height: 34px; }
      .progress-slider-bar-track { max-width: 100%; }

      .utility-audio-controls {
        width: 100%;
        justify-content: space-between;
        padding-top: 0.4rem;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      #deck-volume-slider { width: 90px; }

      .queue-panel-drawer {
        width: 100% !important;
        right: -100% !important;
        bottom: 145px !important;
        top: 0 !important;
        height: calc(100vh - 145px) !important;
        border-left: none;
      }

      .queue-panel-drawer.open { right: 0 !important; }
      .alert-toast-popup { bottom: 160px; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <div class="brand-section">
        <div class="brand-logo-ym">▶</div>
        <h1 class="brand-title">Aura Music</h1>
      </div>
      
      <nav class="nav-menu">
        <button type="button" class="nav-item active" data-target="pane-home">홈</button>
        <button type="button" class="nav-item" data-target="pane-search">검색</button>
        <button type="button" class="nav-item" data-target="pane-top100">차트 (Top 100)</button>
        <button type="button" class="nav-item" data-target="pane-library">보관함 및 설정</button>
      </nav>
    </aside>

    <main class="main-viewport">
      <header class="top-header-bar">
        <div class="search-wrapper">
          <svg class="search-icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" class="search-input" id="search-query-field" placeholder="곡, 아티스트, 앨범 검색">
        </div>
      </header>

      <div class="view-content-pane">
        
        <section class="view-pane active" id="pane-home">
          <div class="mood-chips-container" id="mood-chips-box">
            <div class="mood-chip active" data-mood="all">전체</div>
            <div class="mood-chip" data-mood="energy">에너지 충전</div>
            <div class="mood-chip" data-mood="chill">휴식기</div>
            <div class="mood-chip" data-mood="focus">집중할 때</div>
            <div class="mood-chip" data-mood="romance">로맨스</div>
          </div>

          <div class="shelf-section" id="shelf-history" style="display:none;">
            <div class="shelf-header"><h2 class="shelf-title">다시 듣기</h2></div>
            <div class="yt-cards-grid" id="history-grid-target"></div>
          </div>

          <div class="shelf-section">
            <div class="shelf-header">
              <h2 class="shelf-title" id="recommend-shelf-title">빠른 선곡</h2>
            </div>
            <div class="quick-picks-grid" id="quick-picks-target"></div>
          </div>

          <div class="shelf-section">
            <div class="shelf-header"><h2 class="shelf-title">추천 믹스</h2></div>
            <div class="yt-cards-grid" id="home-recommend-grid-target"></div>

      function cleanTrackTitle(title) {
        return title
          .replace(/\[오피셜\]|\[MV\]|\[Music Video\]|오피셜|뮤직비디오/gi, "")
          .replace(/\(Official Video\)\|\(Official Audio\)\|\(MV\)/gi, "")
          .replace(/Official\s(Music\sVideo|Video|Audio)/gi, "")
          .replace(/【.*】|\[.*\]/g, "")
          .trim();
      }

      function triggerToast(msg) {
        dom.toastBox.textContent = msg;
        dom.toastBox.classList.add("active-trigger");
        clearTimeout(dom.toastBox._timer);
        dom.toastBox._timer = setTimeout(() => dom.toastBox.classList.remove("active-trigger"), 2000);
      }

      function parseTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${String(s).padStart(2, '0')}`;
      }

      function initSystemStorage() {
        STATE.apiKey = localStorage.getItem("aura_ym_key") || "";
        dom.apiKeyInput.value = STATE.apiKey;

        try {
          STATE.likedTracks = JSON.parse(localStorage.getItem("aura_ym_liked") || "[]");
          STATE.historyTracks = JSON.parse(localStorage.getItem("aura_ym_history") || "[]");
          STATE.customPlaylists = JSON.parse(localStorage.getItem("aura_ym_custom_pls") || "{}");
        } catch {
          STATE.likedTracks = [];
          STATE.historyTracks = [];
          STATE.customPlaylists = {};
        }
        updateLikedListView();
        updateHistoryListView();
        updateCustomPlaylistsView();
      }

      async function callYoutubeApi(endpoint, params) {
        const url = new URL(`https://www.googleapis.com/youtube/v3/${endpoint}`);
        params.key = STATE.apiKey;
        Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
        const res = await fetch(url);
        if (!res.ok) throw new Error("API Failure");
        return await res.json();
      }

      function generateMockTop100() {
        const seed = [
          { id: "phuiiNCxRMg", title: "Supernova", channelTitle: "aespa" },
          { id: "ImuWa3SJulY", title: "고민중독 (T.B.H)", channelTitle: "QWER" },
          { id: "JvY79b0wCH0", title: "Magnetic", channelTitle: "ILLIT" },
          { id: "9wUKhEgnllc", title: "Hype Boy", channelTitle: "NewJeans" },
          { id: "TQEukk4O1dU", title: "Love wins all", channelTitle: "IU" },
          { id: "ivdTn0L5t5U", title: "I AM", channelTitle: "IVE" },
          { id: "xO1Bv-0Xy0Q", title: "한 페이지가 될 수 있게", channelTitle: "DAY6" }
        ];
        
        let list = [];
        for (let i = 0; i < 100; i++) {
          const s = seed[i % seed.length];
          list.push({ id: s.id, title: s.title, channelTitle: s.channelTitle, rank: i + 1 });
        }
        return list;
      }

      async function renderTop100View() {
        dom.top100ListTarget.innerHTML = `<p style="color:var(--text-muted); padding:1rem;">차트 데이터를 실시간으로 동기화하는 중입니다...</p>`;
        try {
          const res = await fetch('/api/top100');
          const data = await res.json();
          if (data.success && Array.isArray(data.tracks)) {
            const tracks = data.tracks;
            dom.top100ListTarget.innerHTML = tracks.map((t, idx) => `
              <div class="table-row" data-id="${t.id}" data-index="${idx}">
                <span style="font-size:1rem; font-weight:700; color:var(--accent); width:35px; text-align:center;">${t.rank}</span>
                <img src="${t.albumArt}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;" onerror="this.src='https://i.ytimg.com/vi/${t.id}/mqdefault.jpg'">
                <div style="flex:1; min-width:0;">
                  <div class="qp-title row-song-title">${t.title}</div>
                  <div class="qp-artist">${t.artist}</div>
                </div>
                <button type="button" class="inline-add-btn" data-id="${t.id}" style="right: 1rem;" title="재생목록에 추가">＋</button>
              </div>
            `).join("");

            bindTrackEvents(dom.top100ListTarget, tracks);
          } else { throw new Error("Invalid chart data"); }
        } catch (e) {
          const tracks = generateMockTop100();
          dom.top100Title.textContent = "실시간 인기 차트 Top 100 (데모 데이터)";
          dom.top100ListTarget.innerHTML = tracks.map((t, idx) => `

            </div>
          `).join("");

      function updateLyricsView() {
        const track = STATE.playbackQueue[STATE.currentQueueIndex];
        if (!track) {
          dom.lyricsContent.innerHTML = "재생 중인 곡이 없습니다.";
          return;
        }
        dom.lyricsContent.innerHTML = `<p style="color:var(--text-muted); padding:1rem;">가사를 불러오는 중입니다...</p>`;
        const title = track.title;
        const artist = track.channelTitle || track.artist || "";
        const melonId = /^\d+$/.test(track.id) ? track.id : "";

        fetch(`/api/lyrics?title=${encodeURIComponent(title)}&artist=${encodeURIComponent(artist)}&melonId=${melonId}`)
          .then(res => res.json())
          .then(data => {
            const currentTrack = STATE.playbackQueue[STATE.currentQueueIndex];
            if (currentTrack && currentTrack.id === track.id) { dom.lyricsContent.innerText = data.lyrics; }
          })
          .catch(err => {
            const currentTrack = STATE.playbackQueue[STATE.currentQueueIndex];
            if (currentTrack && currentTrack.id === track.id) {
              dom.lyricsContent.innerText = `[${title} - ${artist}]\n\n가사를 불러올 수 없습니다.\n\nAura Music과 함께 즐거운 감상 되세요.`;
            }
          });
      }

      async function dispatchSearch(query, isLoadMore = false) {
        if (!query.trim()) {
          switchPanel("pane-home");
          return;
        }

        if (!isLoadMore) {
          STATE.currentSearchQuery = query;
          STATE.currentSearchTracks = [];
          dom.searchTitle.textContent = `"${query}" 검색 결과`;
          dom.searchListTarget.innerHTML = `<p style="color:var(--text-muted); padding:1rem;">검색 중...</p>`;
          dom.searchLoadMoreBtn.style.display = "none";
          switchPanel("pane-search");
        } else {
          dom.searchLoadMoreBtn.textContent = "불러오는 중...";
        }

        if (!STATE.apiKey) {
          const matched = CORE_DATABASE.all.filter(t => 
            t.title.toLowerCase().includes(query.toLowerCase()) || 
            t.channelTitle.toLowerCase().includes(query.toLowerCase())
          );
          dom.searchTitle.textContent = `"${query}" 검색 결과 (데모 데이터)`;
          STATE.currentSearchTracks = matched;
          renderSearchResults();
          return;
        }

        try {
          const optimizationQuery = `${query} official audio topic`;
          const params = { part: "snippet", q: optimizationQuery, type: "video", videoCategoryId: "10", maxResults: "50" };
          if (isLoadMore && STATE.searchNextPageToken) params.pageToken = STATE.searchNextPageToken;

          const data = await callYoutubeApi("search", params);
          STATE.searchNextPageToken = data.nextPageToken || "";

          const dynamicTracks = data.items.map(item => ({
            id: item.id.videoId, title: cleanTrackTitle(item.snippet.title), channelTitle: item.snippet.channelTitle
          })).filter(t => t.id);

          STATE.currentSearchTracks.push(...dynamicTracks);
          renderSearchResults();

          if (STATE.searchNextPageToken) {
            dom.searchLoadMoreBtn.style.display = "block";
            dom.searchLoadMoreBtn.textContent = "결과 더 보기 ▽";
          } else {
            dom.searchLoadMoreBtn.style.display = "none";
          }
        } catch (e) {
          triggerToast("검색 도중 에러가 발생했습니다.");
          if (isLoadMore) dom.searchLoadMoreBtn.textContent = "결과 더 보기 ▽";
        }
      }

      function renderSearchResults() {
        if (!STATE.currentSearchTracks.length) {
          dom.searchListTarget.innerHTML = `<p style="color:var(--text-muted); padding:1rem;">검색 결과가 없습니다.</p>`;
          return;
        }

        dom.searchListTarget.innerHTML = STATE.currentSearchTracks.map((track, idx) => `
          <div class="table-row" data-id="${track.id}" data-index="${idx}">
            <span style="font-size:0.8rem; color:var(--text-muted); width:20px;">${idx + 1}</span>
            <img src="https://i.ytimg.com/vi/${track.id}/mqdefault.jpg" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
            <div style="flex:1; min-width:0;">
              <div class="qp-title row-song-title">${track.title}</div>
              <div class="qp-artist">${track.channelTitle}</div>
            </div>
            <button type="button" class="inline-add-btn" data-id="${track.id}" style="right: 1rem;" title="재생목록에 추가">＋</button>
          </div>
        `).join("");

        bindTrackEvents(dom.searchListTarget, STATE.currentSearchTracks);
        highlightActiveElementsGlobal();
      }

      // [기능 3] 나를 위한 맞춤 추천 기능 적용 (시청 기록 기반)
      async function renderHomeFeeds(isLoadMore = false) {
        let pool = CORE_DATABASE[STATE.currentMood] || CORE_DATABASE.all;
        let searchQueryStr = "Kpop Music Latest Hits";
        let shelfTitleText = "빠른 선곡";

        // 기록 기반 추천 로직 (전체 모드일 때 발동)
        if (STATE.currentMood === "all" && STATE.historyTracks.length > 0) {
            const favoriteArtist = STATE.historyTracks[0].channelTitle || STATE.historyTracks[0].artist;
            if (favoriteArtist) {
                searchQueryStr = `${favoriteArtist} 노래 추천`;
                shelfTitleText = `'${favoriteArtist}' 좋아하시나요? 맞춤 추천`;
                
                // 데모 모드를 위해 기록에 있는 아티스트와 일치하는 트랙을 상단에 띄움
                if (!STATE.apiKey) {
                    const matched = CORE_DATABASE.all.filter(t => t.channelTitle === favoriteArtist);
                    pool = matched.length > 0 ? [...matched, ...CORE_DATABASE.all.filter(t => t.channelTitle !== favoriteArtist)] : pool;
                }
            }
        } else if (STATE.currentMood !== "all") {
            const queryMap = { energy: "신나는 케이팝 댄스 트랙", chill: "감성 인디 발라드", focus: "공부할때 듣는 로파이", romance: "달달한 알앤비 고백송" };
            searchQueryStr = queryMap[STATE.currentMood];
            shelfTitleText = "맞춤형 추천 트랙";
        }
        
        if (!isLoadMore) {
            STATE.homeRecommendTracks = [];
            STATE.homeNextPageToken = "";
            dom.homeLoadMoreBtn.style.display = "none";
            dom.recommendTitle.textContent = shelfTitleText;
        } else {
            dom.homeLoadMoreBtn.textContent = "불러오는 중...";
        }

        if (STATE.apiKey) {
          try {
            const params = { part: "snippet", q: searchQueryStr, type: "video", videoCategoryId: "10", maxResults: "40" };
            if (isLoadMore && STATE.homeNextPageToken) params.pageToken = STATE.homeNextPageToken;

            const data = await callYoutubeApi("search", params);
            STATE.homeNextPageToken = data.nextPageToken || "";

            const parsed = data.items.map(item => ({
              id: item.id.videoId, title: cleanTrackTitle(item.snippet.title), channelTitle: item.snippet.channelTitle
            })).filter(t => t.id);
            
            if (!isLoadMore) {
                renderQuickPicks(parsed.slice(0, 8));
                STATE.homeRecommendTracks = parsed.slice(8);
                renderRecommendGrid(STATE.homeRecommendTracks);
            } else {
                STATE.homeRecommendTracks.push(...parsed);
                renderRecommendGrid(STATE.homeRecommendTracks);
            }

            if (STATE.homeNextPageToken) {
              dom.homeLoadMoreBtn.style.display = "block";
              dom.homeLoadMoreBtn.textContent = "추천 곡 더 보기 ▽";
            } else { dom.homeLoadMoreBtn.style.display = "none"; }
            return;
          } catch (e) {
            console.error("API Error");
          }
        }

        // 데모 환경 (API 키 없을 때)
        dom.recommendTitle.textContent = shelfTitleText + " (데모)";
        renderQuickPicks(pool);
        renderRecommendGrid(CORE_DATABASE.all);
      }

      function renderQuickPicks(tracks) {
        if (!tracks.length) return;
        dom.quickPicksGrid.innerHTML = tracks.map((track, idx) => `
          <div class="quick-pick-item" data-id="${track.id}" data-index="${idx}">
            <img class="qp-thumbnail" src="https://i.ytimg.com/vi/${track.id}/mqdefault.jpg">
            <div class="qp-meta">
              <div class="qp-title">${track.title}</div>
              <div class="qp-artist">${track.channelTitle}</div>
            </div>
            <button type="button" class="inline-add-btn" data-id="${track.id}" title="재생목록에 추가">＋</button>
          </div>
        `).join("");
        bindTrackEvents(dom.quickPicksGrid, tracks);
      }

      function renderRecommendGrid(tracks) {
        dom.recommendGrid.innerHTML = tracks.map((track, idx) => `
          <div class="music-square-card" data-id="${track.id}" data-index="${idx}">
            <button type="button" class="card-add-overlay-btn" data-id="${track.id}" title="재생목록에 추가">＋</button>
            <div class="card-thumb-wrapper">
              <img src="https://i.ytimg.com/vi/${track.id}/mqdefault.jpg" loading="lazy">
              <div class="card-play-overlay">
                <div class="overlay-play-icon">▶</div>
              </div>
            </div>
            <div class="card-title">${track.title}</div>
            <div class="card-artist">${track.channelTitle}</div>
          </div>
        `).join("");
        bindTrackEvents(dom.recommendGrid, tracks, true);
        highlightActiveElementsGlobal();
      }

      function updateLikedListView() {
        if (!STATE.likedTracks.length) {
          dom.likedTable.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem; padding: 0.5rem 0;">좋아요 표시한 곡이 여기에 표시됩니다.</p>`;
          return;
        }
        dom.likedTable.innerHTML = STATE.likedTracks.map((t, idx) => `
          <div class="table-row" data-id="${t.id}" data-index="${idx}">
            <img src="https://i.ytimg.com/vi/${t.id}/mqdefault.jpg" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
            <div style="flex:1; min-width:0;">
              <div class="qp-title row-song-title">${t.title}</div>
              <div class="qp-artist">${t.channelTitle}</div>
            </div>
            <button type="button" class="inline-add-btn" data-id="${t.id}" style="right: 1rem;" title="다른 재생목록에 추가">＋</button>
          </div>
        `).join("");
        bindTrackEvents(dom.likedTable, STATE.likedTracks);
      }

      function updateHistoryListView() {
        if (!STATE.historyTracks.length) {
          dom.historyShelf.style.display = "none";
          return;
        }
        dom.historyShelf.style.display = "block";
        dom.historyGrid.innerHTML = STATE.historyTracks.slice(0, 6).map((t, idx) => `
          <div class="music-square-card" data-id="${t.id}" data-index="${idx}">
            <button type="button" class="card-add-overlay-btn" data-id="${t.id}">＋</button>
            <div class="card-thumb-wrapper">
              <img src="https://i.ytimg.com/vi/${t.id}/mqdefault.jpg">
              <div class="card-play-overlay"><div class="overlay-play-icon">▶</div></div>
            </div>
            <div class="card-title">${t.title}</div>
            <div class="card-artist">${t.channelTitle}</div>
          </div>
        `).join("");
        bindTrackEvents(dom.historyGrid, STATE.historyTracks, true);
      }

      function updateCustomPlaylistsView() {
        const keys = Object.keys(STATE.customPlaylists);
        if (!keys.length) {
          dom.playlistsContainer.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">생성된 재생목록이 없습니다.</p>`;
          return;
        }

        dom.playlistsContainer.innerHTML = keys.map(playlistName => {
          const tracks = STATE.customPlaylists[playlistName];
          let tracksHtml = `<p style="color:var(--text-muted); font-size:0.8rem; padding: 0.5rem 1rem;">재생목록이 비어있습니다.</p>`;
          
          if (tracks.length) {
            tracksHtml = tracks.map((t, idx) => `
              <div class="table-row" data-playlist="${playlistName}" data-id="${t.id}" data-index="${idx}">
                <span style="font-size:0.8rem; color:var(--text-muted); width:15px;">${idx + 1}</span>
                <img src="https://i.ytimg.com/vi/${t.id}/mqdefault.jpg" style="width:34px; height:34px; object-fit:cover; border-radius:4px;">
                <div style="flex:1; min-width:0;">
                  <div class="qp-title row-song-title" style="font-size:0.88rem;">${t.title}</div>
                  <div class="qp-artist" style="font-size:0.75rem;">${t.channelTitle}</div>
                </div>
                <button type="button" class="inline-add-btn remove-from-pl-btn" data-playlist="${playlistName}" data-id="${t.id}" style="right: 1rem; font-size:0.8rem;" title="재생목록에서 제거">✕</button>
              </div>
            `).join("");
          }

          return `
            <div class="playlist-folder-item">
              <div class="playlist-folder-header">
                <h3 style="font-size:0.95rem; font-weight:700; color:var(--accent);">${playlistName} <span style="color:#fff; font-weight:400; font-size:0.8rem;">(${tracks.length}곡)</span></h3>
                <div style="display:flex; gap:0.5rem;">
                  ${tracks.length ? `<button type="button" class="play-pl-entire-btn" data-playlist="${playlistName}" style="background:#fff; color:#000; border:none; padding:0.2rem 0.6rem; font-size:0.75rem; font-weight:700; border-radius:4px; cursor:pointer;">전체 재생 ▶</button>` : ''}
                  <button type="button" class="delete-pl-entire-btn" data-playlist="${playlistName}" style="background:transparent; border:1px solid #444; color:#aaa; padding:0.2rem 0.4rem; font-size:0.75rem; border-radius:4px; cursor:pointer;">삭제</button>
                </div>
              </div>
              <div class="track-list-table">${tracksHtml}</div>
            </div>
          `;
        }).join("");

        dom.playlistsContainer.querySelectorAll(".table-row").forEach(el => {
          el.addEventListener("click", (e) => {
            if (e.target.classList.contains('remove-from-pl-btn')) return;
            const plName = el.dataset.playlist;
            setPlaylistContextAndPlay(STATE.customPlaylists[plName], el.dataset.id, el.dataset.index);
          });
        });

        dom.playlistsContainer.querySelectorAll(".remove-from-pl-btn").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            removeTrackFromPlaylist(btn.dataset.playlist, btn.dataset.id);
          });
        });

        dom.playlistsContainer.querySelectorAll(".play-pl-entire-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const plName = btn.dataset.playlist;
            const tracks = STATE.customPlaylists[plName];
            if(tracks.length) setPlaylistContextAndPlay(tracks, tracks[0].id, 0);
          });
        });

        dom.playlistsContainer.querySelectorAll(".delete-pl-entire-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            if(confirm(`'${btn.dataset.playlist}' 재생목록을 완전히 삭제하시겠습니까?`)) {
              deletePlaylist(btn.dataset.playlist);
            }
          });
        });
      }

      function bindTrackEvents(container, trackList, isCard = false) {
        const itemClass = isCard ? ".music-square-card" : ".quick-pick-item, .table-row";
        const btnClass = isCard ? ".card-add-overlay-btn" : ".inline-add-btn";

        container.querySelectorAll(itemClass).forEach(el => {
          el.addEventListener("click", (e) => {
            if (e.target.classList.contains(btnClass.substring(1))) return;
            setPlaylistContextAndPlay(trackList, el.dataset.id, el.dataset.index);
          });
        });

        container.querySelectorAll(btnClass).forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const trackObj = trackList.find(t => t.id === btn.dataset.id);
            openPlaylistModal(trackObj);
          });
        });
      }

      function createNewPlaylist() {
        const name = dom.createPlaylistInput.value.trim();
        if (!name) return triggerToast("재생목록 이름을 입력해주세요.");
        if (STATE.customPlaylists[name]) return triggerToast("이미 존재하는 재생목록 이름입니다.");
        STATE.customPlaylists[name] = [];
        localStorage.setItem("aura_ym_custom_pls", JSON.stringify(STATE.customPlaylists));
        dom.createPlaylistInput.value = "";
        updateCustomPlaylistsView();
        triggerToast(`'${name}' 재생목록이 생성되었습니다.`);
      }

      function deletePlaylist(name) {
        delete STATE.customPlaylists[name];
        localStorage.setItem("aura_ym_custom_pls", JSON.stringify(STATE.customPlaylists));
        updateCustomPlaylistsView();
        triggerToast("재생목록이 삭제되었습니다.");
      }

      function addTrackToPlaylist(name, track) {
        if (name === "liked_bucket_builtin") {
          if (!STATE.likedTracks.some(t => t.id === track.id)) {
            STATE.likedTracks.push(track);
            localStorage.setItem("aura_ym_liked", JSON.stringify(STATE.likedTracks));
            updateLikedListView();
            triggerToast("좋아요 한 음악에 추가되었습니다.");
            if (STATE.playbackQueue[STATE.currentQueueIndex]?.id === track.id) {
              dom.deckLikeBtn.classList.add("active");
              dom.deckLikeBtn.textContent = "♥";
            }
          } else { triggerToast("이미 좋아요 한 음악에 존재합니다."); }
          return;
        }

        const list = STATE.customPlaylists[name];
        if (list) {
          if (list.some(t => t.id === track.id)) return triggerToast("이미 재생목록에 존재하는 곡입니다.");
          list.push(track);
          localStorage.setItem("aura_ym_custom_pls", JSON.stringify(STATE.customPlaylists));
          updateCustomPlaylistsView();
          triggerToast(`'${name}'에 곡이 추가되었습니다.`);
        }
      }

      function removeTrackFromPlaylist(name, trackId) {
        if (STATE.customPlaylists[name]) {
          STATE.customPlaylists[name] = STATE.customPlaylists[name].filter(t => t.id !== trackId);
          localStorage.setItem("aura_ym_custom_pls", JSON.stringify(STATE.customPlaylists));
          updateCustomPlaylistsView();
          triggerToast("재생목록에서 곡이 제거되었습니다.");
        }
      }

      function openPlaylistModal(track) {
        STATE.pendingModalTrack = track;
        let optionsHtml = `<button type="button" class="modal-playlist-btn" data-target="liked_bucket_builtin">💖 좋아요 한 음악</button>`;
        Object.keys(STATE.customPlaylists).forEach(k => {
          optionsHtml += `<button type="button" class="modal-playlist-btn" data-target="${k}">📁 ${k}</button>`;
        });
        dom.modalPlaylistsBucket.innerHTML = optionsHtml;
        dom.playlistModal.classList.add("active-modal");

        dom.modalPlaylistsBucket.querySelectorAll(".modal-playlist-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            addTrackToPlaylist(btn.dataset.target, STATE.pendingModalTrack);
            closePlaylistModal();
          });
        });
      }

      function closePlaylistModal() {
        dom.playlistModal.classList.remove("active-modal");
        STATE.pendingModalTrack = null;
      }

      function setPlaylistContextAndPlay(tracksPool, targetTrackId, targetIndex) {
        STATE.playbackQueue = [...tracksPool];
        if (targetIndex !== undefined && targetIndex !== null) {
          STATE.currentQueueIndex = Number(targetIndex);
        } else {
          STATE.currentQueueIndex = STATE.playbackQueue.findIndex(t => t.id === targetTrackId);
        }
        
        if (STATE.shuffleActive) {
          STATE.preShuffleQueue = [...tracksPool];
          const currentTrack = STATE.playbackQueue[STATE.currentQueueIndex];
          STATE.playbackQueue.splice(STATE.currentQueueIndex, 1);
          for (let i = STATE.playbackQueue.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [STATE.playbackQueue[i], STATE.playbackQueue[j]] = [STATE.playbackQueue[j], STATE.playbackQueue[i]];
          }
          STATE.playbackQueue.unshift(currentTrack);
          STATE.currentQueueIndex = 0;
        }

        executeTrackPlayback();
      }

      // [기능 2] 시스템 미디어 세션(잠금화면 제어)을 셋업하는 함수
      function setupMediaSessionActions() {
        if (!('mediaSession' in navigator)) return;
        
        navigator.mediaSession.setActionHandler('play', () => { if(STATE.isEngineReady) STATE.playerEngine.playVideo(); });
        navigator.mediaSession.setActionHandler('pause', () => { if(STATE.isEngineReady) STATE.playerEngine.pauseVideo(); });
        navigator.mediaSession.setActionHandler('previoustrack', () => skipPrevTrack());
        navigator.mediaSession.setActionHandler('nexttrack', () => skipNextTrack());
      }

      async function executeTrackPlayback() {
        const track = STATE.playbackQueue[STATE.currentQueueIndex];
        if (!track) return;

        const isYtId = /^[a-zA-Z0-9_-]{11}$/.test(track.id);
        
        dom.deckName.textContent = "로딩 중...";
        dom.deckArtist.textContent = track.artist || track.channelTitle || "";
        dom.deckArt.src = track.albumArt || `https://i.ytimg.com/vi/${track.id}/mqdefault.jpg`;
        dom.deckArt.style.opacity = "1";
        dom.deckPlayBtn.disabled = true;

        let ytVideoId = track.id;

        if (!isYtId) {
          if (track.ytId) {
            ytVideoId = track.ytId;
          } else {
            try {
              const queryStr = `${track.artist || track.channelTitle || ""} ${track.title} official audio`;
              const res = await fetch(`/api/search?q=${encodeURIComponent(queryStr)}`);
              const resData = await res.json();
              if (resData.success && resData.videoId) {
                ytVideoId = resData.videoId;
                track.ytId = ytVideoId;
              } else {
                triggerToast("YouTube에서 곡을 찾을 수 없습니다.");
                dom.deckName.textContent = "재생 실패";
                return;
              }
            } catch (e) {
              triggerToast("YouTube 연동 중 오류가 발생했습니다.");
              dom.deckName.textContent = "재생 실패";
              return;
            }
          }
        }

        dom.deckName.textContent = track.title;
        dom.deckArtist.textContent = track.artist || track.channelTitle || "알 수 없음";
        dom.deckArt.src = track.albumArt || `https://i.ytimg.com/vi/${ytVideoId}/mqdefault.jpg`;
        dom.deckArt.style.opacity = "1";
        dom.deckPlayBtn.disabled = false;

        const isLiked = STATE.likedTracks.some(t => t.id === track.id);
        dom.deckLikeBtn.classList.toggle("active", isLiked);
        dom.deckLikeBtn.textContent = isLiked ? "♥" : "♡";

        if (STATE.isEngineReady) {
          STATE.playerEngine.loadVideoById(ytVideoId);
          STATE.playerEngine.playVideo();
        }

        STATE.historyTracks = [track, ...STATE.historyTracks.filter(t => t.id !== track.id)];
        localStorage.setItem("aura_ym_history", JSON.stringify(STATE.historyTracks));
        updateHistoryListView();
        
        renderQueuePanelListView();
        updateLyricsView();
        highlightActiveElementsGlobal();
        startTimelineTracker();

        // [기능 2] 잠금화면에 곡 제목 및 표지 이미지 반영
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.title,
            artist: track.artist || track.channelTitle || 'Aura Music',
            album: 'Aura Premium',
            artwork: [
              { src: track.albumArt || `https://i.ytimg.com/vi/${ytVideoId}/mqdefault.jpg`, sizes: '320x180', type: 'image/jpeg' },
              { src: track.albumArt || `https://i.ytimg.com/vi/${ytVideoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }
            ]
          });
          setupMediaSessionActions();
        }
      }

      function startTimelineTracker() {
        clearInterval(STATE.tickerTimer);
        STATE.tickerTimer = setInterval(() => {
          if (!STATE.isEngineReady || !STATE.playerEngine.getCurrentTime) return;
          const cur = STATE.playerEngine.getCurrentTime();
          const dur = STATE.playerEngine.getDuration();
          
          dom.deckTimeCurrent.textContent = parseTime(cur);
          dom.deckTimeTotal.textContent = parseTime(dur);
          
          const pct = dur ? (cur / dur) * 100 : 0;
          dom.deckProgressFill.style.width = `${pct}%`;
        }, 500);
      }

      // [기능 4] 대기열 순서 변경 (모바일에서 안정적인 위/아래 이동 버튼 추가)
      function renderQueuePanelListView() {
        dom.queueListTarget.innerHTML = STATE.playbackQueue.map((track, idx) => {
          const isCurrent = idx === STATE.currentQueueIndex;
          return `
            <div class="quick-pick-item queue-item-row ${isCurrent ? 'active-playing' : ''}" style="${isCurrent ? 'background:rgba(255,0,51,0.155);' : ''}; padding-right:2.5rem;" data-index="${idx}">
              <img class="qp-thumbnail" src="https://i.ytimg.com/vi/${track.id}/mqdefault.jpg" style="width:36px; height:36px; pointer-events:none;">
              <div class="qp-meta" style="pointer-events:none;">
                <div class="qp-title" style="font-size:0.88rem; ${isCurrent ? 'color:var(--accent); font-weight:700;' : ''}">${track.title}</div>
                <div class="qp-artist" style="font-size:0.75rem;">${track.channelTitle}</div>
              </div>
              <div class="queue-reorder-controls">
                <button type="button" class="queue-move-btn queue-move-up" data-index="${idx}" title="위로 이동">▲</button>
                <button type="button" class="queue-move-btn queue-move-down" data-index="${idx}" title="아래로 이동">▼</button>
              </div>
            </div>
          `;
        }).join("");

        // 트랙 클릭 시 재생 이벤트
        dom.queueListTarget.querySelectorAll(".queue-item-row").forEach(el => {
          el.addEventListener("click", (e) => {
            // 위/아래 버튼 클릭 시 재생되지 않게 막음
            if (e.target.classList.contains("queue-move-btn")) return;
            STATE.currentQueueIndex = parseInt(el.dataset.index);
            executeTrackPlayback();
          });
        });

        // 위로 이동 버튼 이벤트
        dom.queueListTarget.querySelectorAll(".queue-move-up").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.index);
            if (idx > 0) reorderQueue(idx, idx - 1);
          });
        });

        // 아래로 이동 버튼 이벤트
        dom.queueListTarget.querySelectorAll(".queue-move-down").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.index);
            if (idx < STATE.playbackQueue.length - 1) reorderQueue(idx, idx + 1);
          });
        });
      }

      // [기능 4] 대기열 배열 순서 조작 및 인덱스 업데이트
      function reorderQueue(fromIdx, toIdx) {
        // 배열 아이템 이동
        const movedTrack = STATE.playbackQueue.splice(fromIdx, 1)[0];
        STATE.playbackQueue.splice(toIdx, 0, movedTrack);

        // 현재 재생 중인 곡의 인덱스를 안전하게 추적
        if (STATE.currentQueueIndex === fromIdx) {
          STATE.currentQueueIndex = toIdx;
        } else if (STATE.currentQueueIndex === toIdx) {
          STATE.currentQueueIndex = fromIdx;
        }

        renderQueuePanelListView(); // 뷰 업데이트
      }

      function highlightActiveElementsGlobal() {
        const currentTrack = STATE.playbackQueue[STATE.currentQueueIndex];
        if (!currentTrack) return;
        document.querySelectorAll(".table-row, .quick-pick-item, .music-square-card").forEach(el => {
          if (el.dataset.id === currentTrack.id) { el.classList.add("active-playing"); } 
          else { el.classList.remove("active-playing"); }
        });
      }

      function skipNextTrack() {
        if (!STATE.playbackQueue.length) return;
        if (STATE.repeatMode === "one") { executeTrackPlayback(); return; }
        STATE.currentQueueIndex++;
        if (STATE.currentQueueIndex >= STATE.playbackQueue.length) {
          STATE.currentQueueIndex = 0; 
          triggerToast("재생목록이 끝나 처음 곡부터 다시 재생합니다.");
        }
        executeTrackPlayback();
      }

      function skipPrevTrack() {
        if (!STATE.playbackQueue.length) return;
        STATE.currentQueueIndex--;
        if (STATE.currentQueueIndex < 0) { STATE.currentQueueIndex = STATE.playbackQueue.length - 1; }
        executeTrackPlayback();
      }

      function switchPanel(targetPaneId) {
        dom.navItems.forEach(btn => btn.classList.toggle("active", btn.dataset.target === targetPaneId));
        dom.viewPanes.forEach(pane => pane.classList.toggle("active", pane.id === targetPaneId));
        
        if (targetPaneId === "pane-top100") renderTop100View();
      }

      function initCoreEventListeners() {
        dom.navItems.forEach(item => {
          item.addEventListener("click", () => switchPanel(item.dataset.target));
        });

        dom.moodChips.forEach(chip => {
          chip.addEventListener("click", () => {
            dom.moodChips.forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            STATE.currentMood = chip.dataset.mood;
            renderHomeFeeds();
          });
        });

        dom.searchField.addEventListener("keydown", (e) => {
          if (e.key === "Enter") dispatchSearch(dom.searchField.value);
        });

        dom.searchLoadMoreBtn.addEventListener("click", () => {
          dispatchSearch(STATE.currentSearchQuery, true);
        });
        
        dom.homeLoadMoreBtn.addEventListener("click", () => {
          renderHomeFeeds(true);
        });

        dom.createPlaylistBtn.addEventListener("click", createNewPlaylist);
        dom.createPlaylistInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") createNewPlaylist();
        });

        dom.modalCloseBtn.addEventListener("click", closePlaylistModal);
        dom.playlistModal.addEventListener("click", (e) => {
          if(e.target === dom.playlistModal) closePlaylistModal();
        });

        dom.saveKeyBtn.addEventListener("click", () => {
          const val = dom.apiKeyInput.value.trim();
          localStorage.setItem("aura_ym_key", val);
          STATE.apiKey = val;
          triggerToast("API 설정 정보가 성공적으로 반영되었습니다.");
          renderHomeFeeds();
        });

        dom.deckPlayBtn.addEventListener("click", () => {
          if (!STATE.isEngineReady) return;
          const status = STATE.playerEngine.getPlayerState();
          if (status === 1) { STATE.playerEngine.pauseVideo(); } 
          else { STATE.playerEngine.playVideo(); }
        });

        dom.deckNextBtn.addEventListener("click", skipNextTrack);
        dom.deckPrevBtn.addEventListener("click", skipPrevTrack);

        // [기능 5] 하단 플레이어에 추가한 '+' 버튼 이벤트 (현재 곡을 내 재생목록에 즉시 추가)
        dom.deckAddBtn.addEventListener("click", () => {
          const track = STATE.playbackQueue[STATE.currentQueueIndex];
          if (track) openPlaylistModal(track);
          else triggerToast("재생 중인 곡이 없습니다.");
        });

        dom.deckProgressRail.addEventListener("click", (e) => {
          if (!STATE.isEngineReady || !STATE.playerEngine.getDuration) return;
          const rect = dom.deckProgressRail.getBoundingClientRect();
          const ratio = (e.clientX - rect.left) / rect.width;
          const targetSec = STATE.playerEngine.getDuration() * ratio;
          STATE.playerEngine.seekTo(targetSec, true);
        });

        dom.deckVolume.addEventListener("input", () => {
          if (STATE.isEngineReady && STATE.playerEngine.setVolume) {
            STATE.playerEngine.setVolume(dom.deckVolume.value);
          }
        });

        dom.deckLikeBtn.addEventListener("click", () => {
          const track = STATE.playbackQueue[STATE.currentQueueIndex];
          if (!track) return;

          const idx = STATE.likedTracks.findIndex(t => t.id === track.id);
          if (idx > -1) {
            STATE.likedTracks.splice(idx, 1);
            triggerToast("보관함 좋아요 취소");
          } else {
            STATE.likedTracks.push(track);
            triggerToast("좋아요 한 음악 보관함 저장 완료 💖");
          }
          localStorage.setItem("aura_ym_liked", JSON.stringify(STATE.likedTracks));
          updateLikedListView();
          
          const isLiked = idx === -1;
          dom.deckLikeBtn.classList.toggle("active", isLiked);
          dom.deckLikeBtn.textContent = isLiked ? "♥" : "♡";
        });

        dom.deckShuffleBtn.addEventListener("click", () => {
          STATE.shuffleActive = !STATE.shuffleActive;
          dom.deckShuffleBtn.classList.toggle("active", STATE.shuffleActive);
          triggerToast(STATE.shuffleActive ? "셔플 모드가 켜졌습니다." : "셔플 모드가 꺼졌습니다.");
        });

        dom.deckRepeatBtn.addEventListener("click", () => {
          if (STATE.repeatMode === "none") {
            STATE.repeatMode = "all";
            dom.deckRepeatBtn.classList.add("active");
            dom.deckRepeatBtn.textContent = "🔁";
            triggerToast("전체 반복 재생 모드");
          } else if (STATE.repeatMode === "all") {
            STATE.repeatMode = "one";
            dom.deckRepeatBtn.classList.add("active");
            dom.deckRepeatBtn.textContent = "🔂";
            triggerToast("한 곡 반복 재생 모드");
          } else {
            STATE.repeatMode = "none";
            dom.deckRepeatBtn.classList.remove("active");
            dom.deckRepeatBtn.textContent = "🔁";
            triggerToast("기본 무한 사이클 재생 모드");
          }
        });

        dom.queueToggleBtn.addEventListener("click", () => {
          dom.queueDrawer.classList.toggle("open");
          if (dom.queueDrawer.classList.contains("open")) { dom.lyricsDrawer.classList.remove("open"); }
        });

        dom.lyricsToggleBtn.addEventListener("click", () => {
          dom.lyricsDrawer.classList.toggle("open");
          if (dom.lyricsDrawer.classList.contains("open")) { dom.queueDrawer.classList.remove("open"); }
        });
      }

      window.onYouTubeIframeAPIReady = function() {
        STATE.playerEngine = new YT.Player("youtube-iframe-hardware-engine", {
          // [중요] 1x1 픽셀 사이즈로 설정하여 모바일 브라우저의 백그라운드 영상 정지 제재를 회피
          height: "1", width: "1",
          playerVars: {
            autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, iv_load_policy: 3
          },
          events: {
            onReady: () => {
              STATE.isEngineReady = true;
              STATE.playerEngine.setVolume(dom.deckVolume.value);
            },
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) {
                dom.deckPlayIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
              } else {
                dom.deckPlayIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
                if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
              }

              if (e.data === YT.PlayerState.ENDED) { skipNextTrack(); }
            }
          }
        });
      };

      const scriptNode = document.createElement("script");
      scriptNode.src = "https://www.youtube.com/iframe_api";
      const anchor = document.getElementsByTagName("script")[0];
      anchor.parentNode.insertBefore(scriptNode, anchor);

      initSystemStorage();
      initCoreEventListeners();
      renderHomeFeeds();

    })();
  </script>
</body>
</html>
